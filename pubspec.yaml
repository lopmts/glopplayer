name: glopplayer
description: Um player de música local simples em Flutter.
publish_to: "none"
version: 1.0.2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Reprodução de áudio
  just_audio: ^0.10.6
  # API completa de sessão de mídia em segundo plano — permite escolher
  # exatamente quais botões aparecem na notificação (aqui usamos só
  # pause/play + próxima, sem "stop" e sem "anterior")
  audio_service: ^0.18.17
  # Configuração da sessão de áudio (foco de áudio, etc)
  audio_session: ^0.2.4

  # Consulta músicas, álbuns, artistas e capas direto do MediaStore do Android
  on_audio_query: ^2.9.0

  # Necessário para salvar a capa em um arquivo temporário (a notificação
  # de mídia do Android só aceita file://, content:// ou https:// — não
  # aceita base64/data URI)
  path_provider: ^2.1.5

  #theme
  shared_preferences: ^2.3.2

  flutter_native_splash: 2.4.7

  permission_handler: ^11.3.1

  # Storage & Persistence
  flutter_secure_storage: ^10.3.1
  path: ^1.9.0

  # HTTP & Network
  http: ^1.6.0
  connectivity_plus: ^7.2.0
  open_filex: ^4.7.0

  # UI Components
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_markdown: ^0.7.7+1

  # Material Expressive 3 / Dynamic Color
  dynamic_color: ^1.7.0

  # Gerenciamento de estado simples
  provider: ^6.1.2
  app_links: ^6.3.2
  metadata_god: ^1.1.0 # leitura/escrita de tags (título, artista, capa...)
  mime: ^2.0.0 # detectar mimetype de imagens locais
  image_picker: ^1.2.3 # escolher capa da galeria

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2+1
  google_fonts: ^8.2.0
  palette_generator: ^0.3.3+7
  home_widget: ^0.9.3

  # Notifications
  flutter_local_notifications: ^22.0.1
  audioplayers: ^6.7.1
  package_info_plus: ^10.2.1
  file_picker: ^12.0.0
  markdown: ^7.3.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "icon_foreground_android.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "icon_foreground_android.png"
  ios_content_mode: scaleAspectFill
  remove_alpha_ios: true
  background_color_ios: "#000000"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#12151e" # fundo (dá pra usar sua cor "Midnight Slate")
  image: icon_foreground_android.png # logo centralizado, PNG com fundo transparente

  color_dark: "#12151e"
  image_dark: icon_foreground_android.png

  android_12:
    image: icon_android.png
    icon_background_color: "#12151e"
    icon_background_color_dark: "#12151e"

  android: true
  ios: true
  web: false

  fullscreen: true

flutter:
  uses-material-design: true
